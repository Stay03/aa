<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Toy Soldiers · Model Gallery</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; color: #fff; }
  canvas { display: block; }
  #bar { position: fixed; left: 12px; top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #bar button { font: inherit; font-weight: 700; color: #fff; background: rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.3); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  #bar button.on { background: #3f7d3a; border-color: #9be08f; }
  #hint { position: fixed; left: 12px; bottom: 12px; font-size: 13px; background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 8px; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="hint">Drag to orbit · scroll to zoom · right-drag to pan</div>
<script type="module" src="/src/gallery.js"></script>
</body>
</html>
